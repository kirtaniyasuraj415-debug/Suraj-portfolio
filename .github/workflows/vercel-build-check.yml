name: Vercel Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  npm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Notify IndexNow
        continue-on-error: true
        env:
          SITE_URL: https://suraj-portfolio-phi-six.vercel.app
        run: node scripts/submit-indexnow.mjs
