name: Platform Build Checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  vercel-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Install dependencies
        run: npm install

      - name: Build for Vercel / standard Next.js
        run: npm run build

      - name: Notify IndexNow
        continue-on-error: true
        env:
          SITE_URL: https://surajkirtaniya.qd.je
        run: node scripts/submit-indexnow.mjs

  cloudflare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKERS_CI: "1"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Install dependencies with npm
        run: npm install

      - name: Build Cloudflare Worker with OpenNext
        run: npm run build:cloudflare

      - name: Verify Cloudflare worker output
        run: |
          test -f .open-next/worker.js
          test -d .open-next/assets
